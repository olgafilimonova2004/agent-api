name: api-base

services:
  api-base:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.docker
    ports:
      - 8000:8000

  db:
    image: postgres:18
    restart: always
    environment:
      USE_DOCKER_ENV: true
      POSTGRES_USER: ${POSTGRES_USER:? Variable POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:? Variable POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:? Variable POSTGRES_DB is not set}
    volumes:
      - pgdata:/var/lib/postgresql:rw
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
