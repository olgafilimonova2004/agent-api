repos:
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.71
    hooks:
      - id: ty

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix, --ignore, BLE001]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # - repo: local
  #   hooks:
  #     - id: pip-audit
  #       name: pip-audit
  #       entry: uv run --with pip-audit pip-audit
  #       language: system
  #       pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks

ci:
  # Leave pip-audit to only run locally and not in CI
  # pre-commit.ci does not allow external network calls
  skip: [pip-audit]
