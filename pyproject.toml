[project]
name = "checklist-validator"
version = "0.1.0"
description = "Checklist answer validation service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dishka>=1.7.2",
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.12.5",
    "pytest-asyncio>=1.0.0",
    "uvicorn>=0.34.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
checklist-validator = "src.entrypoint.main:main"

[tool.ty.src]
exclude = []
include = ["src/", "main.py"]
